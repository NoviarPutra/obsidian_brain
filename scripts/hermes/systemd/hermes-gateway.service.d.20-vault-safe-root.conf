# Confines every write that goes through the file tools (write_file, patch,
# delete_file, move_file) to two roots. Checked last in _classify_write_denial,
# after the credential and HERMES_HOME denylists, and a violation returns a hard
# error string to the model rather than prompting or silently skipping.
#
# Deliberately a separate drop-in from 10-resources.conf so that
# `hermes gateway install --force` cannot wipe it on an upgrade.
#
# NOT a boundary for `terminal`: agent/file_safety.py is never consulted by
# tools/terminal_tool.py, and its own docstring says so. The path policy hook is
# what covers that, best-effort.
[Service]
Environment=HERMES_WRITE_SAFE_ROOT=/home/voldemort/documents:/home/voldemort/services/obsidian-stack/vault
# The bundled note-taking/obsidian skill reads this; unset it falls back to
# ~/Documents/Obsidian Vault, which does not exist on this host.
Environment=OBSIDIAN_VAULT_PATH=/home/voldemort/services/obsidian-stack/vault
